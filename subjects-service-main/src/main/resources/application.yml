server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: subjects-service
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:subjects_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

azure:
  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    container-name: ${AZURE_STORAGE_CONTAINER_NAME:academic-files}
    sas-expiry-minutes: ${AZURE_STORAGE_SAS_EXPIRY_MINUTES:15}

app:
  seed:
    enabled: ${SEED_ENABLED:true}
