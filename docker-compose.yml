services:
  # -------------------------------------------------------------
  # 1. Base de Datos Relacional (PostgreSQL)
  # Aprovisiona las 4 bases de datos independientes requeridas
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: acad-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - acad-network

  # -------------------------------------------------------------
  # 2. Caché Compartido (Redis)
  # Usado por el API Gateway para catálogo de materias
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: acad-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - acad-network

  # -------------------------------------------------------------
  # 3. Almacenamiento de Objetos Local (Azurite - Emulador Azure)
  # Para emular Azure Blob Storage en desarrollo local
  # -------------------------------------------------------------
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: acad-azurite
    restart: unless-stopped
    ports:
      - "10000:10000"
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000"
    networks:
      - acad-network

  # -------------------------------------------------------------
  # 4. Módulo de Autenticación (auth-service)
  # -------------------------------------------------------------
  auth-service:
    build:
      context: ./auth-service-main
      dockerfile: Dockerfile
    container_name: acad-auth-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-uptc_sistemas_distribuidos_super_secret_jwt_key_2026_lab4!}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - acad-network

  # -------------------------------------------------------------
  # 5. Módulo de Estudiantes (students-service)
  # -------------------------------------------------------------
  students-service:
    build:
      context: ./students-service-main
      dockerfile: Dockerfile
    container_name: acad-students-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: students_db
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME:-academic-files}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - acad-network

  # -------------------------------------------------------------
  # 6. Módulo de Materias (subjects-service)
  # -------------------------------------------------------------
  subjects-service:
    build:
      context: ./subjects-service-main
      dockerfile: Dockerfile
    container_name: acad-subjects-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: subjects_db
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME:-academic-files}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - acad-network

  # -------------------------------------------------------------
  # 7. Módulo de Inscripciones (enrollments-service)
  # -------------------------------------------------------------
  enrollments-service:
    build:
      context: ./enrollments-service-main
      dockerfile: Dockerfile
    container_name: acad-enrollments-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: enrollments_db
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - acad-network

  # -------------------------------------------------------------
  # 8. API Gateway (Spring Cloud Gateway)
  # -------------------------------------------------------------
  api-gateway:
    build:
      context: ./api-gateway-main
      dockerfile: Dockerfile
    container_name: acad-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8084
      STUDENTS_SERVICE_URL: http://students-service:8081
      SUBJECTS_SERVICE_URL: http://subjects-service:8082
      ENROLLMENTS_SERVICE_URL: http://enrollments-service:8083
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-uptc_sistemas_distribuidos_super_secret_jwt_key_2026_lab4!}
      GATEWAY_SECURITY_ENABLED: "true"
      GATEWAY_CACHE_ENABLED: "true"
      GATEWAY_CACHE_TTL_SECONDS: 180
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      students-service:
        condition: service_started
      subjects-service:
        condition: service_started
      enrollments-service:
        condition: service_started
    networks:
      - acad-network

  # -------------------------------------------------------------
  # 9. Frontend SPA Web (React + Vite + Nginx)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: acad-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - acad-network

networks:
  acad-network:
    driver: bridge

volumes:
  postgres_data:

