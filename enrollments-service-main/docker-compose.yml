services:
  enrollments-db:
    image: postgres:16-alpine
    container_name: enrollments-db
    environment:
      POSTGRES_DB: enrollments_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - enrollments_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enrollments_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - university-network

  enrollments-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enrollments-service
    ports:
      - "8083:8083"
    environment:
      DB_HOST: enrollments-db
      DB_PORT: 5432
      DB_NAME: enrollments_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8083
    depends_on:
      enrollments-db:
        condition: service_healthy
    networks:
      - university-network

volumes:
  enrollments_data:
    driver: local

networks:
  university-network:
    name: university-network
    driver: bridge
