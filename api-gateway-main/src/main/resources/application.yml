server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 2000ms
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "*"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowed-headers: "*"
            exposed-headers:
              - "X-Cache"
              - "Authorization"
              - "Content-Disposition"
      server:
        webflux:
          routes:
            # ---------------- Auth Service (:8084) ----------------
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/auth/**

            # ---------------- Students Service (:8081) ----------------
            - id: students-service
              uri: ${STUDENTS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/students/**
            - id: programs-service
              uri: ${STUDENTS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/programs/**
            - id: contacts-service
              uri: ${STUDENTS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/contacts/**
            - id: documents-service
              uri: ${STUDENTS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/documents/**

            # ---------------- Subjects Service (:8082) ----------------
            - id: subjects-service
              uri: ${SUBJECTS_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/subjects/**
            - id: teachers-service
              uri: ${SUBJECTS_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/teachers/**
            - id: courses-service
              uri: ${SUBJECTS_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/courses/**

            # ---------------- Enrollments Service (:8083) ----------------
            - id: enrollments-service
              uri: ${ENROLLMENTS_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/enrollments/**
            - id: grades-service
              uri: ${ENROLLMENTS_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/grades/**
            - id: enrollment-status-history-service
              uri: ${ENROLLMENTS_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/enrollment-status-history/**

          httpclient:
            connect-timeout: 3000
            response-timeout: 5s

jwt:
  secret: ${JWT_SECRET:uptc_sistemas_distribuidos_super_secret_jwt_key_2026_lab4!}

gateway:
  security:
    enabled: ${GATEWAY_SECURITY_ENABLED:true}
  cache:
    enabled: ${GATEWAY_CACHE_ENABLED:true}
    ttl-seconds: ${GATEWAY_CACHE_TTL_SECONDS:180}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.cloud.gateway: INFO
    co.edu.uptc.apigateway: INFO
